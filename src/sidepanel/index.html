<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>wakaru</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="idle">
    <header class="topbar">
      <div class="target">
        <span class="dot" aria-hidden="true"></span>
        <span id="target-title" class="target-title">アイコンを押したタブ</span>
      </div>
      <div class="actions">
        <button id="start" class="primary compact" type="button" hidden>開始</button>
        <button id="stop" class="danger compact" type="button" hidden>停止</button>
        <button id="busy" class="busy compact" type="button" aria-disabled="true" hidden><span class="spinner" aria-hidden="true"></span></button>
      </div>
      <button id="clear" class="icon-button" type="button" aria-label="字幕と翻訳の文脈を消す" title="クリア" disabled>
        <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4.5h4V6M6 6l.7 9.5h6.6L14 6" /></svg>
      </button>
      <button id="open-settings" class="icon-button" type="button" popovertarget="sheet" aria-label="設定" title="設定">
        <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M3.5 6.5h8M15.5 6.5h1M3.5 13.5h1M8.5 13.5h8" /><circle cx="13.5" cy="6.5" r="2" /><circle cx="6.5" cy="13.5" r="2" /></svg>
      </button>
      <button id="close" class="icon-button" type="button" aria-label="パネルを閉じる" title="閉じる">
        <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
      </button>
    </header>

    <div id="banner" class="banner">
      <p id="message" class="message" role="status"></p>
    </div>

    <main id="subtitles" class="stream">
      <div class="hero">
        <div id="hero-lang-setup" class="hero-setup" hidden>
          <h3 class="field-title" id="hero-lang-title">会議の言語</h3>
          <fieldset class="segmented three" id="hero-lang" aria-labelledby="hero-lang-title" aria-describedby="hero-lang-desc" disabled>
            <div class="track">
              <label>
                <input type="radio" name="hero-lang" value="auto" />
                <span class="option-name">自動</span>
              </label>
              <label>
                <input type="radio" name="hero-lang" value="ja" />
                <span class="option-name">日本語</span>
              </label>
              <label>
                <input type="radio" name="hero-lang" value="en" />
                <span class="option-name">英語</span>
              </label>
            </div>
          </fieldset>
          <p id="hero-lang-desc" class="hint hero-lang-desc"></p>
        </div>
        <div class="hero-start">
          <p id="hero-text" class="hero-text"></p>
          <progress id="progress" class="hero-progress" max="1" aria-label="翻訳モデルのダウンロード" hidden></progress>
          <div class="hero-actions">
            <button id="start-hero" class="primary" type="button" hidden>開始</button>
            <button id="chrome-hero" class="secondary" type="button" hidden>Chrome 翻訳で続ける</button>
          </div>
        </div>
      </div>
      <ol id="utterances" class="utterances"></ol>
      <div id="interim" class="interim" aria-hidden="true"></div>

      <button id="to-latest" class="to-latest" type="button">
        <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M10 4v11M5 10.5l5 5 5-5" /></svg>
        最新へ
      </button>
    </main>

    <div id="sheet" class="sheet" popover role="dialog" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">設定</h2>
        <button id="close-sheet" class="icon-button" type="button" autofocus popovertarget="sheet" popovertargetaction="hide" aria-label="設定を閉じる" title="閉じる">
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
        </button>
      </div>
      <div class="sheet-body">
        <section>
          <div class="field-head">
            <h3 class="field-title" id="engine-title">翻訳エンジン</h3>
            <button id="engine-help" class="hint-button" type="button" aria-label="翻訳エンジンの説明" aria-describedby="engine-hint">?</button>
            <p id="engine-hint" class="field-hint" role="tooltip"></p>
          </div>
          <fieldset class="segmented" id="engine" aria-labelledby="engine-title" aria-describedby="engine-hint engine-status settings-note" disabled>
            <div class="track">
              <label>
                <input type="radio" name="engine" value="plamo" />
                <span class="option-name">PLaMo</span>
              </label>
              <label>
                <input type="radio" name="engine" value="chrome" />
                <span class="option-name">Chrome 翻訳</span>
              </label>
            </div>
          </fieldset>
          <p id="engine-status" class="hint"></p>
          <div class="field-head">
            <h3 class="field-title" id="lang-title">聞き取る言語</h3>
            <button id="lang-help" class="hint-button" type="button" aria-label="言語選択の説明" aria-describedby="lang-desc" hidden>?</button>
            <p id="lang-desc" class="field-hint" role="tooltip"></p>
          </div>
          <fieldset class="segmented three" id="lang" aria-labelledby="lang-title" aria-describedby="lang-desc" disabled>
            <div class="track">
              <label>
                <input type="radio" name="lang" value="auto" />
                <span class="option-name">自動</span>
              </label>
              <label>
                <input type="radio" name="lang" value="ja" />
                <span class="option-name">日本語</span>
              </label>
              <label>
                <input type="radio" name="lang" value="en" />
                <span class="option-name">英語</span>
              </label>
            </div>
          </fieldset>
          <p id="settings-note" class="hint" tabindex="-1">準備中と聞き取り中は変更できません。</p>
        </section>
        <section>
          <div class="field-head">
            <h3 class="field-title">用語集</h3>
            <button id="glossary-help" class="hint-button" type="button" aria-label="用語集の説明" aria-describedby="glossary-hint">?</button>
            <p id="glossary-hint" class="field-hint" role="tooltip">会議でよく使う言葉を1行に1つずつ入れておくと、日本語の聞き取りでその言葉が認識されやすくなります。次に「開始」を押したときから反映されます。</p>
          </div>
          <textarea id="glossary" rows="6" aria-label="用語集" aria-describedby="glossary-hint"></textarea>
        </section>
        <details class="more">
          <summary>不具合の報告用ログ</summary>
          <textarea id="log" readonly rows="8" aria-label="ログ"></textarea>
          <div class="row">
            <button id="copy-log" class="secondary" type="button">ログをコピー</button>
            <button id="clear-log" class="secondary" type="button">ログを消す</button>
          </div>
        </details>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
