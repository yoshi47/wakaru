<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>wakaru</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="target">
        <span class="label">対象タブ</span>
        <span id="target-title">（アイコンを押したタブ）</span>
      </div>
      <button id="close" type="button" title="パネルを閉じる">閉じる</button>
    </header>
    <section class="controls">
      <div class="row">
        <button id="prepare" type="button" disabled>準備</button>
        <button id="start" type="button" disabled>開始</button>
        <button id="stop" type="button" disabled>停止</button>
        <button id="clear" type="button" disabled title="字幕と翻訳の文脈を消す">クリア</button>
        <button id="reset" type="button" disabled>リセット</button>
        <label class="engine">
          翻訳
          <select id="engine" disabled>
            <option value="plamo">PLaMo</option>
            <option value="chrome">Chrome 翻訳</option>
          </select>
        </label>
      </div>
      <div id="message" class="message" role="status"></div>
      <dl class="readiness">
        <dt>言語パック</dt>
        <dd id="ready-langs">未準備</dd>
        <dt>言語判定</dt>
        <dd id="ready-detector">未準備</dd>
        <dt>翻訳</dt>
        <dd id="ready-engine">未準備</dd>
      </dl>
    </section>
    <main id="subtitles">
      <ol id="utterances"></ol>
      <div id="interim" class="interim"></div>
    </main>
    <details id="debug">
      <summary>デバッグ</summary>
      <div id="latency" class="latency"></div>
      <form id="settings" class="settings">
        <label>windowMs <input name="windowMs" type="number" min="100" max="5000" step="any" required /></label>
        <label>enMinConfidence <input name="enMinConfidence" type="number" min="0" max="1" step="any" required /></label>
        <label>enShortMinConfidence <input name="enShortMinConfidence" type="number" min="0" max="1" step="any" required /></label>
        <label>stallMs <input name="stallMs" type="number" min="300" max="10000" step="any" required /></label>
        <label><input name="noise" type="checkbox" /> ノイズを混ぜる</label>
        <span class="note">次の開始から反映</span>
      </form>
      <h3>捨てた候補</h3>
      <ol id="rejected" class="rejected"></ol>
      <h3>ログ</h3>
      <textarea id="log" readonly rows="10"></textarea>
      <div class="row">
        <button id="copy-log" type="button">ログをコピー</button>
        <button id="clear-log" type="button">ログを消す</button>
      </div>
    </details>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
